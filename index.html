<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Mis Clientes y Proyectos</title>
<link rel="manifest" href="manifest.json" />
<meta name="theme-color" content="#f2ebdd" />
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;800&family=Poppins:wght@400;600&family=Montserrat:wght@400;700&family=Dancing+Script:wght@700&family=Quicksand:wght@600&display=swap" rel="stylesheet" />
<style>
  :root {
    --bg: #f2ebdd;
    --panel: #faf6ee;
    --panel-2: #ece2cd;
    --border: #d8cbae;
    --text: #332e26;
    --text-dim: #83786a;
    --accent: #6b6152;
    --accent-2: #8a7f6c;
    --good: #5c7a5c;
    --warn: #a3853f;
    --critical: #a35c4f;
    --radius: 4px;
    --serif: 'Playfair Display', Georgia, serif;
    --sans: 'Poppins', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
    font-size: 15px;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: var(--sans);
    background: var(--bg);
    color: var(--text);
  }

  /* ------------------------------------------------------------
     Marca de esquina fina: mismo lenguaje visual del presupuestador
     (dos ticks en L, sutiles) aplicado a tarjetas, modales y paneles.
     ------------------------------------------------------------ */
  .frame-ticks { position: relative; }
  .frame-ticks::before, .frame-ticks::after {
    content: ""; position: absolute; width: 12px; height: 12px; pointer-events: none;
    border-color: var(--accent); opacity: 0.45;
  }
  .frame-ticks::before { top: 7px; left: 7px; border-top: 1px solid; border-left: 1px solid; }
  .frame-ticks::after { bottom: 7px; right: 7px; border-bottom: 1px solid; border-right: 1px solid; }

  /* Filete: separador fino con un rombo, mismo motivo del presupuestador */
  .filete { display: flex; align-items: center; justify-content: center; gap: 10px; margin: 14px 0; }
  .filete::before, .filete::after { content: ""; height: 1px; flex: 1; max-width: 90px; background: var(--border); }
  .filete .diamond { width: 5px; height: 5px; background: var(--accent); transform: rotate(45deg); flex: none; }

  header {
    padding: 20px 26px;
    border-bottom: 1px solid var(--border);
    background: var(--panel);
    display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 8px;
  }
  header h1 { margin: 0 0 4px; font-family: var(--serif); font-weight: 800; font-size: 20px; letter-spacing: 0.2px; }
  header p { margin: 0; color: var(--text-dim); font-size: 11.5px; letter-spacing: 0.06em; text-transform: uppercase; }
  main { max-width: 1080px; margin: 0 auto; padding: 22px; }

  .module-switch { display: flex; gap: 10px; margin-bottom: 20px; }
  .module-switch button {
    flex: 1; padding: 13px; border-radius: var(--radius); border: 1px solid var(--border);
    background: var(--panel); color: var(--text-dim); font-family: var(--sans);
    font-size: 12.5px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; cursor: pointer;
    transition: border-color 0.15s, color 0.15s;
  }
  .module-switch button:hover { border-color: var(--accent-2); color: var(--text); }
  .module-switch button.active { background: var(--text); color: var(--panel); border-color: var(--text); }

  .stats { display: flex; gap: 14px; margin-bottom: 22px; flex-wrap: wrap; }
  .stat-tile {
    flex: 1; min-width: 150px;
    background: var(--panel); border: 1px solid var(--border); border-radius: var(--radius);
    padding: 16px 18px;
  }
  .stat-tile .label { font-family: var(--serif); font-size: 10.5px; color: var(--text-dim); text-transform: uppercase; letter-spacing: 0.12em; font-weight: 700; }
  .stat-tile .value { font-family: var(--serif); font-size: 27px; font-weight: 800; margin-top: 6px; color: var(--text); }

  nav.tabs { display: flex; gap: 6px; margin-bottom: 18px; border-bottom: 1px solid var(--border); flex-wrap: wrap; }
  nav.tabs button {
    background: transparent; border: none; color: var(--text-dim); font-family: var(--sans);
    padding: 11px 14px; font-size: 12.5px; letter-spacing: 0.05em; text-transform: uppercase;
    cursor: pointer; border-bottom: 2px solid transparent; transition: color 0.15s, border-color 0.15s;
  }
  nav.tabs button:hover { color: var(--text); }
  nav.tabs button.active { color: var(--text); border-bottom-color: var(--accent); font-weight: 600; }

  .toolbar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px; gap: 10px; flex-wrap: wrap; }
  .toolbar input[type=text] { flex: 1; min-width: 160px; }

  table { width: 100%; border-collapse: collapse; background: var(--panel); border: 1px solid var(--border); border-radius: var(--radius); overflow: hidden; }
  thead th {
    text-align: left; font-family: var(--serif); font-size: 10.5px; text-transform: uppercase; letter-spacing: 0.1em; font-weight: 700;
    color: var(--text-dim); padding: 12px 14px; border-bottom: 1px solid var(--border); background: var(--panel-2);
  }
  tbody td { padding: 11px 14px; border-bottom: 1px solid var(--border); font-size: 13.5px; vertical-align: top; }
  tbody tr:last-child td { border-bottom: none; }
  tbody tr:hover { background: var(--panel-2); }
  .muted { color: var(--text-dim); }
  .empty-row td { text-align: center; color: var(--text-dim); padding: 34px; font-style: italic; }

  button.btn {
    background: var(--panel); color: var(--text); border: 1px solid var(--border); font-family: var(--sans);
    border-radius: var(--radius); padding: 8px 15px; cursor: pointer; font-size: 12.5px;
    letter-spacing: 0.03em; transition: border-color 0.15s, color 0.15s;
  }
  button.btn:hover { border-color: var(--accent); color: var(--accent); }
  button.btn.primary { background: var(--text); border-color: var(--text); color: var(--panel); font-weight: 600; }
  button.btn.primary:hover { background: var(--accent); border-color: var(--accent); color: var(--panel); }
  button.btn.small { padding: 4px 11px; font-size: 11.5px; }
  button.btn.danger { color: var(--critical); border-color: var(--critical); background: transparent; }
  button.btn.danger:hover { background: var(--critical); color: var(--panel); }

  .badge {
    display: inline-block; padding: 3px 10px; border-radius: 20px; font-size: 10.5px; font-weight: 600;
    letter-spacing: 0.04em; text-transform: uppercase; border: 1px solid currentColor;
  }
  .badge.sin_empezar { color: var(--text-dim); }
  .badge.grabacion { color: var(--accent-2); }
  .badge.edicion { color: var(--accent-2); }
  .badge.aprobacion { color: var(--warn); }
  .badge.cambios { color: var(--critical); }
  .badge.aprobado { color: var(--good); }
  .badge.publicado { color: var(--good); }
  .badge.reels { color: var(--accent-2); }
  .badge.historias { color: var(--accent-2); }
  .badge.videos { color: var(--accent-2); }
  .badge.sin_enviar { color: var(--text-dim); }
  .badge.pendiente { color: var(--warn); }
  .badge.consulta { color: var(--text-dim); }
  .badge.disenio { color: var(--accent-2); }
  .badge.confeccion { color: var(--accent-2); }
  .badge.prueba { color: var(--warn); }
  .badge.listo { color: var(--good); }
  .badge.entregado { color: var(--good); }
  .badge.enviado { color: var(--warn); }
  .badge.aprobado_pres { color: var(--good); }
  .badge.rechazado_pres { color: var(--critical); }

  .pack-card {
    border: 1px solid var(--border); border-radius: var(--radius); padding: 14px; cursor: pointer; flex: 1; min-width: 150px;
    transition: border-color 0.15s, background 0.15s;
  }
  .pack-card.selected { border-color: var(--accent); background: var(--panel-2); }
  .pack-card h4 { margin: 0 0 4px; font-family: var(--serif); font-weight: 700; font-size: 14px; }
  .pack-card p { margin: 0; font-size: 12px; color: var(--text-dim); }

  .color-swatch-input { display: flex; align-items: center; gap: 8px; }
  .color-swatch-input input[type=color] { width: 44px; height: 36px; padding: 2px; flex: none; cursor: pointer; }

  .seguimiento-alert {
    background: var(--panel); border: 1px solid var(--warn); color: var(--text); border-left: 3px solid var(--warn);
    border-radius: var(--radius); padding: 11px 15px; margin-bottom: 18px; font-size: 13px;
  }

  input, select, textarea {
    background: var(--panel); border: 1px solid var(--border); color: var(--text);
    border-radius: var(--radius); padding: 9px 11px; width: 100%; font-family: var(--sans); font-size: 14px;
    transition: border-color 0.15s;
  }
  input:focus, select:focus, textarea:focus { outline: none; border-color: var(--accent); }
  label { font-size: 11px; color: var(--text-dim); text-transform: uppercase; letter-spacing: 0.06em; display: block; margin-bottom: 5px; }
  .field { margin-bottom: 13px; }
  .field-row { display: flex; gap: 10px; }
  .field-row .field { flex: 1; }

  .modal-backdrop {
    position: fixed; inset: 0; background: rgba(51,46,38,0.55);
    display: flex; align-items: center; justify-content: center; padding: 16px; z-index: 50;
  }
  .modal {
    background: var(--panel); border: 1px solid var(--border); border-radius: 6px;
    padding: 26px; width: 100%; max-width: 460px; max-height: 90vh; overflow-y: auto;
    box-shadow: 0 25px 60px rgba(51,46,38,0.18);
  }
  .modal h2 { margin-top: 0; font-family: var(--serif); font-weight: 700; font-size: 17px; letter-spacing: 0.2px; }
  .modal.wide { max-width: 720px; }
  .row-end { display: flex; justify-content: flex-end; gap: 8px; margin-top: 16px; }

  footer { text-align: center; color: var(--text-dim); font-size: 11px; letter-spacing: 0.05em; padding: 26px; }

  .login-screen {
    display: flex; align-items: center; justify-content: center; min-height: 100vh; padding: 20px;
  }
  .login-box {
    background: var(--panel); border: 1px solid var(--border); border-radius: 6px;
    padding: 34px; width: 100%; max-width: 360px;
    box-shadow: 0 25px 60px rgba(51,46,38,0.14);
  }
  .login-box h1 { font-family: var(--serif); font-weight: 800; font-size: 21px; margin-bottom: 8px; }
  .login-box p { color: var(--text-dim); font-size: 13px; margin-top: 0; }
  .msg { font-size: 13px; margin-top: 10px; }
  .msg.ok { color: var(--good); }
  .msg.error { color: var(--critical); }
</style>
</head>
<body>

<div id="login-screen" class="login-screen" style="display:none;">
  <div class="login-box frame-ticks">
    <h1>Mis Clientes y Proyectos</h1>
    <p>Ingrese su email para recibir un link de acceso (sin contraseña). La primera vez que entra en cada aparato hace falta este paso; después queda guardado.</p>
    <div class="field"><input id="login-email" type="email" placeholder="su-email@ejemplo.com" /></div>
    <button class="btn primary" id="login-btn" style="width:100%">Enviar link de acceso</button>
    <div id="login-msg" class="msg"></div>
  </div>
</div>

<div id="app" style="display:none;">
  <header>
    <div>
      <h1>Mis Clientes y Proyectos</h1>
      <p>Se sincroniza automáticamente entre todos sus aparatos.</p>
    </div>
    <div>
      <span class="muted" id="user-email" style="font-size:12px;"></span>
      <button class="btn small" id="logout-btn" style="margin-left:8px;">Salir</button>
    </div>
  </header>

  <main>
    <div class="module-switch">
      <button data-modulo="contenido" class="active" onclick="setModulo('contenido')">Contenido</button>
      <button data-modulo="design" onclick="setModulo('design')">Laila Design</button>
    </div>

    <div id="modulo-contenido">
      <div class="stats" id="stats"></div>
      <div id="seguimientos-alert-contenido"></div>
      <div style="display:flex;justify-content:flex-end;margin-bottom:10px;gap:8px;">
        <button class="btn small" onclick="openBrandConfigModal('contenido')">Datos de marca</button>
        <button class="btn primary small" onclick="openPresupuestadorModal('contenido')">+ Nuevo presupuesto</button>
      </div>

      <nav class="tabs">
        <button data-tab="clientes" class="active">Clientes</button>
        <button data-tab="proyectos">Proyectos</button>
        <button data-tab="packs">Packs</button>
        <button data-tab="presupuestos">Presupuestos</button>
      </nav>

      <section id="tab-clientes"></section>
      <section id="tab-proyectos" style="display:none;"></section>
      <section id="tab-packs" style="display:none;"></section>
      <section id="tab-presupuestos" style="display:none;"></section>
    </div>

    <div id="modulo-design" style="display:none;">
      <div class="stats" id="stats-design"></div>
      <div id="seguimientos-alert-design"></div>
      <div style="display:flex;justify-content:flex-end;margin-bottom:10px;gap:8px;">
        <button class="btn small" onclick="openBrandConfigModal('design')">Datos de marca</button>
        <button class="btn small" onclick="irAPortfolioDesign()">Ver portfolio →</button>
        <button class="btn primary small" onclick="openPresupuestadorModal('design')">+ Nuevo presupuesto</button>
      </div>

      <nav class="tabs">
        <button data-tab-design="clientesDesign" class="active">Clientes</button>
        <button data-tab-design="proyectosDesign">Proyectos</button>
        <button data-tab-design="portfolioDesign">Portfolio</button>
        <button data-tab-design="presupuestosDesign">Presupuestos</button>
      </nav>

      <section id="tab-clientesDesign"></section>
      <section id="tab-proyectosDesign" style="display:none;"></section>
      <section id="tab-portfolioDesign" style="display:none;"></section>
      <section id="tab-presupuestosDesign" style="display:none;"></section>
    </div>
  </main>

  <footer>
    <button class="btn small" onclick="exportData()">Exportar copia (.json)</button>
  </footer>
</div>

<div id="modal-root"></div>

<script src="config.js"></script>
<script>
const ESTADOS = {
  sin_empezar: "Sin empezar",
  grabacion: "En grabación",
  edicion: "En edición",
  aprobacion: "Enviado a aprobación",
  cambios: "Cambios pedidos",
  aprobado: "Aprobado",
  publicado: "Publicado",
};

let auth, db;
let state = {
  clientes: [], proyectos: [], packs: [], piezas: [],
  clientesDesign: [], proyectosDesign: [], portfolios: [],
  brandConfig: { contenido: null, design: null },
  presupuestosGenerados: [],
  paletas: [],
};
let activeTab = "clientes";
let activeTabDesign = "clientesDesign";
let moduloActivo = "contenido";
let user = null;
let piezasUnsub = null;

const ESTADOS_DESIGN = {
  consulta: "Consulta",
  disenio: "En diseño",
  confeccion: "En confección",
  prueba: "En prueba",
  listo: "Listo",
  entregado: "Entregado",
};

const CATEGORIAS_FOTO = {
  reuniones: "Reuniones",
  creacion: "Creación",
  confeccion: "Confección",
  pruebas: "Pruebas",
  final: "Final",
};

const TIPOS_EVENTO = {
  casamiento: "Casamiento",
  bar_mitzvah: "Bar/Bat Mitzvah",
  quince: "15 años",
  cumpleanos: "Cumpleaños",
  aniversario: "Aniversario",
  otro: "Otro",
};

let __fotosCache = {}; // proyectoId -> [{id, categoria, data, ...}]
let __presupuestosCache = {}; // proyectoId -> [{id, pdfData, ...}]
let __portfolioBuilderFotos = [];
let __portfolioBuilderSeleccion = new Set();
let __portfolioFiltroTipoEvento = "";
let __portfolioFiltroColor = "";

// ------------------------------------------------------------
// Presupuestador: rubros, frases por evento y tipografías
// ------------------------------------------------------------
const RUBROS_CONTENIDO = {
  gastronomia: { label: "Gastronomía / Restaurantes", icono: "🍽" },
  indumentaria: { label: "Indumentaria / Moda", icono: "👗" },
  bazar: { label: "Bazar / Regalos", icono: "🎁" },
  salud: { label: "Salud / Estética", icono: "💆" },
  inmobiliaria: { label: "Inmobiliaria", icono: "🏠" },
  tecnologia: { label: "Tecnología / Servicios", icono: "💻" },
  otro: { label: "Otro rubro", icono: "✨" },
};

const FRASES_EVENTO = {
  casamiento: { icono: "💍", frase: "Quiero acompañarte en tu casamiento" },
  bar_mitzvah: { icono: "✡", frase: "Quiero ser parte de tu Bar/Bat Mitzvah" },
  quince: { icono: "👑", frase: "Quiero acompañarte en tus 15" },
  cumpleanos: { icono: "🎉", frase: "Quiero ser parte de tu festejo" },
  aniversario: { icono: "💐", frase: "Quiero acompañarte en tu aniversario" },
  otro: { icono: "✨", frase: "Quiero acompañarte en tu evento" },
};

const FUENTES_PRESUPUESTO = {
  playfair: { label: "Playfair Display (elegante)", css: "'Playfair Display', serif" },
  poppins: { label: "Poppins (moderna)", css: "'Poppins', sans-serif" },
  montserrat: { label: "Montserrat (clásica)", css: "'Montserrat', sans-serif" },
  dancing: { label: "Dancing Script (cursiva)", css: "'Dancing Script', cursive" },
  quicksand: { label: "Quicksand (suave)", css: "'Quicksand', sans-serif" },
};

const OPCIONES_SEGUIMIENTO = [
  { dias: 0, label: "No recordarme" },
  { dias: 3, label: "En 3 días" },
  { dias: 5, label: "En 5 días" },
  { dias: 7, label: "En 7 días" },
  { dias: 10, label: "En 10 días" },
  { dias: 15, label: "En 15 días" },
];

const OPCIONES_VALIDEZ = [
  { dias: 0, label: "Sin fecha de validez" },
  { dias: 3, label: "3 días" },
  { dias: 5, label: "5 días" },
  { dias: 7, label: "7 días" },
  { dias: 10, label: "10 días" },
  { dias: 15, label: "15 días" },
  { dias: 30, label: "30 días" },
];

const OPCIONES_AVISO_VENCIMIENTO = [
  { dias: 0, label: "No avisarme" },
  { dias: 1, label: "1 día antes de vencer" },
  { dias: 2, label: "2 días antes de vencer" },
  { dias: 3, label: "3 días antes de vencer" },
  { dias: 5, label: "5 días antes de vencer" },
];

let __presupuestadorContexto = null; // { modulo, proyectoId }
let __presupuestadorScopeSeleccion = null; // datos recolectados del formulario
let __presupuestadorPdfDataUri = null;
let __presupuestadorPackSeleccionado = null; // id de pack, "personalizado", o null

const PRODUCTOS = { reels: "Reels", historias: "Historias", videos: "Videos" };
const FRECUENCIAS = { unico: "Único", semanal: "Semanal", quincenal: "Quincenal", mensual: "Mensual" };

// ------------------------------------------------------------
// Inicialización / login
// ------------------------------------------------------------
function init() {
  if (!window.FIREBASE_CONFIG || window.FIREBASE_CONFIG.apiKey.startsWith("PEGAR_AQUI")) {
    document.body.innerHTML = "<p style='padding:40px;font-family:sans-serif;'>Falta configurar config.js.</p>";
    return;
  }
  firebase.initializeApp(window.FIREBASE_CONFIG);
  auth = firebase.auth();
  db = firebase.firestore();

  completeEmailLinkSignInIfNeeded();

  auth.onAuthStateChanged((u) => {
    user = u;
    if (u) {
      showApp();
      loadAll();
    } else {
      if (piezasUnsub) { piezasUnsub(); piezasUnsub = null; }
      state = {
        clientes: [], proyectos: [], packs: [], piezas: [],
        clientesDesign: [], proyectosDesign: [], portfolios: [],
        brandConfig: { contenido: null, design: null },
        presupuestosGenerados: [],
        paletas: [],
      };
      showLogin();
    }
  });

  document.getElementById("login-btn").addEventListener("click", handleLogin);
  document.getElementById("logout-btn").addEventListener("click", () => auth.signOut());

  document.querySelectorAll("#modulo-contenido nav.tabs button[data-tab]").forEach((btn) => {
    btn.addEventListener("click", () => {
      activeTab = btn.dataset.tab;
      document.querySelectorAll("#modulo-contenido nav.tabs button[data-tab]").forEach((b) => b.classList.toggle("active", b === btn));
      document.getElementById("tab-clientes").style.display = activeTab === "clientes" ? "block" : "none";
      document.getElementById("tab-proyectos").style.display = activeTab === "proyectos" ? "block" : "none";
      document.getElementById("tab-packs").style.display = activeTab === "packs" ? "block" : "none";
      document.getElementById("tab-presupuestos").style.display = activeTab === "presupuestos" ? "block" : "none";
      renderAll();
    });
  });

  document.querySelectorAll("#modulo-design nav.tabs button[data-tab-design]").forEach((btn) => {
    btn.addEventListener("click", () => {
      activeTabDesign = btn.dataset.tabDesign;
      document.querySelectorAll("#modulo-design nav.tabs button[data-tab-design]").forEach((b) => b.classList.toggle("active", b === btn));
      document.getElementById("tab-clientesDesign").style.display = activeTabDesign === "clientesDesign" ? "block" : "none";
      document.getElementById("tab-proyectosDesign").style.display = activeTabDesign === "proyectosDesign" ? "block" : "none";
      document.getElementById("tab-portfolioDesign").style.display = activeTabDesign === "portfolioDesign" ? "block" : "none";
      document.getElementById("tab-presupuestosDesign").style.display = activeTabDesign === "presupuestosDesign" ? "block" : "none";
      renderAll();
    });
  });
}

function setModulo(m) {
  moduloActivo = m;
  document.querySelectorAll(".module-switch button").forEach((b) => b.classList.toggle("active", b.dataset.modulo === m));
  document.getElementById("modulo-contenido").style.display = m === "contenido" ? "block" : "none";
  document.getElementById("modulo-design").style.display = m === "design" ? "block" : "none";
  renderAll();
}

function irAPortfolioDesign() {
  setModulo("design");
  const btn = document.querySelector('#modulo-design nav.tabs button[data-tab-design="portfolioDesign"]');

function completeEmailLinkSignInIfNeeded() {

// Datos (Firestore)
// ------------------------------------------------------------
async function loadAll() {
  const uid = user.uid;
  const [clientesSnap, proyectosSnap, packsSnap, clientesDesignSnap, proyectosDesignSnap, portfoliosSnap, brandConfigSnap, presupuestosGenSnap, paletasSnap] = await Promise.all([
    db.collection("clientes").where("ownerId", "==", uid).get(),
    db.collection("proyectosSimple").where("ownerId", "==", uid).get(),
    db.collection("packs").where("ownerId", "==", uid).get(),
    db.collection("clientesDesign").where("ownerId", "==", uid).get(),
    db.collection("proyectosDesign").where("ownerId", "==", uid).get(),
    db.collection("portfoliosDesign").where("ownerId", "==", uid).get(),
    db.collection("brandConfig").where("ownerId", "==", uid).get(),
    db.collection("presupuestosGenerados").where("ownerId", "==", uid).get(),
    db.collection("paletasColores").where("ownerId", "==", uid).get(),
  ]);
  state.clientes = clientesSnap.docs.map((d) => ({ id: d.id, ...d.data() })).sort((a, b) => a.nombre.localeCompare(b.nombre));
  state.proyectos = proyectosSnap.docs.map((d) => ({ id: d.id, ...d.data() }));
  state.packs = packsSnap.docs.map((d) => ({ id: d.id, ...d.data() }));
  state.clientesDesign = clientesDesignSnap.docs.map((d) => ({ id: d.id, ...d.data() })).sort((a, b) => a.nombre.localeCompare(b.nombre));
  state.proyectosDesign = proyectosDesignSnap.docs.map((d) => ({ id: d.id, ...d.data() }));
  state.portfolios = portfoliosSnap.docs.map((d) => ({ id: d.id, ...d.data() })).sort((a, b) => (b.createdAtMillis || 0) - (a.createdAtMillis || 0));
  state.brandConfig = { contenido: null, design: null };
  brandConfigSnap.docs.forEach((d) => {
    const data = d.data();
    if (data.modulo === "contenido" || data.modulo === "design") state.brandConfig[data.modulo] = { id: d.id, ...data };
  });
  state.presupuestosGenerados = presupuestosGenSnap.docs
    .map((d) => ({ id: d.id, ...d.data() }))
    .sort((a, b) => (b.createdAtMillis || 0) - (a.createdAtMillis || 0));
  state.paletas = paletasSnap.docs
    .map((d) => ({ id: d.id, ...d.data() }))
    .sort((a, b) => (a.createdAtMillis || 0) - (b.createdAtMillis || 0));

  // Cargamos las piezas de cada proyecto directamente (no depende de ningún índice especial
  // de Firestore, a diferencia de la consulta "todas juntas" de más abajo). Esto garantiza que
  // el checklist de cada proyecto siempre se vea, aunque ese índice no esté creado todavía.
  try {
    const piezasPorProyecto = await Promise.all(
      state.proyectos.map((p) =>
        db.collection("proyectosSimple").doc(p.id).collection("piezas").where("ownerId", "==", uid).get()
      )
    );
    const piezasCargadas = [];
    state.proyectos.forEach((p, i) => {
      piezasPorProyecto[i].docs.forEach((d) => piezasCargadas.push({ id: d.id, proyectoId: p.id, ...d.data() }));
    });
    state.piezas = piezasCargadas;
  } catch (err) {
    console.error("Error cargando piezas por proyecto:", err);
  }

  renderAll();
  startPiezasListener(uid);
}

function startPiezasListener(uid) {
  if (piezasUnsub) return;
  piezasUnsub = db.collectionGroup("piezas").where("ownerId", "==", uid).onSnapshot(
    (snap) => {
      state.piezas = snap.docs.map((d) => ({ id: d.id, proyectoId: d.ref.parent.parent.id, ...d.data() }));
      renderAll();
      // si el modal de un proyecto está abierto, lo refrescamos para reflejar cambios en vivo,
      // pero NUNCA si hay un campo del modal siendo editado en este momento (para no borrar lo que está escribiendo)
      const editandoAlgo = document.activeElement && document.getElementById("modal-root").contains(document.activeElement);
      if (window.__openProyectoModalId && !editandoAlgo) {
        openProyectoModal(window.__openProyectoModalId, true);
      }
    },
    (err) => {
      console.error("Error escuchando piezas:", err);
    }
  );
}

  renderStats();
  renderClientes();
  renderProyectos();
  renderPacks();
  renderStatsDesign();
  renderClientesDesign();
  renderProyectosDesign();
  renderPortfolioDesign();
  renderPresupuestosTab("contenido");
  renderPresupuestosTab("design");
  renderSeguimientosAlert("contenido");
  renderSeguimientosAlert("design");
}

function piezasForProyecto(proyectoId) {
  return state.piezas
    .filter((pz) => pz.proyectoId === proyectoId)
    .sort((a, b) => (a.tipo === b.tipo ? a.numero - b.numero : String(a.tipo).localeCompare(String(b.tipo))));
}

function proyectoPiezasStats(proyectoId) {
  const piezas = piezasForProyecto(proyectoId);
  return {
    total: piezas.length,
    entregadas: piezas.filter((p) => p.entregada).length,
    sinRevisar: piezas.filter((p) => p.vistoPorMi === false).length,
  };
}

function renderStats() {
  const totalClientes = state.clientes.length;
  const proyectosActivos = state.proyectos.filter((p) => p.estado !== "publicado").length;
  const piezasPendientes = state.proyectos.reduce((sum, p) => {
    if (p.estado === "publicado") return sum;
    return sum + Math.max(0, proyectoPiezasStats(p.id).total - proyectoPiezasStats(p.id).entregadas);
  }, 0);
  const piezasPorRevisar = state.piezas.filter((pz) => pz.vistoPorMi === false).length;
  const seguimientosHoy = seguimientosPendientesCount("contenido");
  document.getElementById("stats").innerHTML = `
    <div class="stat-tile frame-ticks"><div class="label">Clientes</div><div class="value">${totalClientes}</div></div>
    <div class="stat-tile frame-ticks"><div class="label">Proyectos activos</div><div class="value">${proyectosActivos}</div></div>
    <div class="stat-tile frame-ticks"><div class="label">Piezas pendientes</div><div class="value">${piezasPendientes}</div></div>
    <div class="stat-tile frame-ticks"><div class="label">Piezas por revisar</div><div class="value">${piezasPorRevisar}</div></div>
    <div class="stat-tile frame-ticks"><div class="label">Seguimientos hoy</div><div class="value">${seguimientosHoy}</div></div>
  `;
}

async function saveCliente(id) {
  const nombre = document.getElementById("f-nombre").value.trim();
  if (!nombre) { alert("Ingrese el nombre del cliente."); return; }
  const data = {
    nombre,
    contacto: document.getElementById("f-contacto").value.trim(),
    telefono: document.getElementById("f-telefono").value.trim(),
    email: document.getElementById("f-email").value.trim(),
    instagram: document.getElementById("f-instagram").value.trim(),
    rubro: document.getElementById("f-rubro").value.trim(),
    notas: document.getElementById("f-notas").value.trim(),
  };
  if (id) {
    await db.collection("clientes").doc(id).update(data);
  } else {
    data.ownerId = user.uid;
    data.createdAt = firebase.firestore.FieldValue.serverTimestamp();
    await db.collection("clientes").add(data);
  }
  closeModal();
  await loadAll();
}

async function deleteCliente(id) {
  const usado = state.proyectos.some((p) => p.clienteId === id);
  if (usado && !confirm("Este cliente tiene proyectos cargados. Si lo borra, esos proyectos quedan sin cliente asignado. ¿Continuar?")) return;
  if (!usado && !confirm("¿Borrar este cliente?")) return;
  await db.collection("clientes").doc(id).delete();
  await loadAll();
}

function clienteNombre(id) {
  const c = state.clientes.find((x) => x.id === id);
  return c ? c.nombre : "(cliente eliminado)";
}

async function openProyectoModal(id, isRefresh) {
  window.__openProyectoModalId = id || null;
  const p = id ? state.proyectos.find((x) => x.id === id) : null;

  // migración automática de proyectos viejos (piezas guardadas como lista adentro del proyecto)
  if (p && p.piezas && p.piezas.length && piezasForProyecto(id).length === 0 && !isRefresh) {
    await migrateOldPiezas(p);
  }

  const clienteOptions = state.clientes
    .map((c) => `<option value="${c.id}" ${p && p.clienteId === c.id ? "selected" : ""}>${esc(c.nombre)}</option>`)
    .join("");
  const packOptions =
    `<option value="">Personalizado (sin pack)</option>` +
    state.packs
      .map((pk) => `<option value="${pk.id}" ${p && p.packId === pk.id ? "selected" : ""}>${esc(pk.nombre)} — ${packItemsText(pk.items)}</option>`)
      .join("");

  const existingPiezas = id ? piezasForProyecto(id) : [];

  let checklistHtml;
  if (!id) {
    checklistHtml = `<div class="muted" style="padding:8px 0;">Elija un plan o ingrese una cantidad de piezas. El checklist se genera automáticamente al guardar.</div>`;
  } else if (existingPiezas.length === 0) {
    checklistHtml = `<div class="muted" style="padding:8px 0;">Todavía no hay piezas. Elija un plan o ingrese una cantidad y toque "Generar checklist".</div>`;
  } else {
    checklistHtml = existingPiezas.map((pz) => piezaRowHtml(pz)).join("");
  }

  openModal(`
    <h2>${p ? "Editar proyecto" : "Nuevo proyecto"}</h2>
    <div class="field"><label>Cliente *</label><select id="f-cliente">${clienteOptions}</select></div>
    <div class="field"><label>Proyecto / Descripción *</label><input id="f-descripcion" value="${p ? escAttr(p.descripcion) : ""}" placeholder="Ej: Pack apertura de local" /></div>
    <div class="field"><label>Plan contratado</label><select id="f-pack" onchange="onProyectoPackChange()">${packOptions}</select></div>
    <div class="field-row">
      <div class="field"><label>Cantidad de piezas (si no elige un plan)</label><input id="f-totales" type="number" min="0" value="${existingPiezas.length || 1}" /></div>
      <div class="field" style="max-width:170px;display:flex;align-items:flex-end;">
        <button type="button" class="btn small" style="width:100%;" onclick="onGenerarChecklistClick('${id || ""}')" ${!id ? "disabled title='Guarde el proyecto primero'" : ""}>Generar checklist</button>
      </div>
    </div>
    <div class="field">
      <label>Piezas del proyecto — marque a medida que las sube, guarde el link y envíela a aprobación</label>
      <div id="piezas-checklist">${checklistHtml}</div>
    </div>
    <div class="field-row">
      <div class="field"><label>Estado</label>
        <select id="f-estado">${Object.entries(ESTADOS).map(([k, v]) => `<option value="${k}" ${p && p.estado === k ? "selected" : ""}>${v}</option>`).join("")}</select>
      </div>
      <div class="field"><label>Fecha límite</label><input id="f-fecha" type="date" value="${p && p.fechaLimite ? p.fechaLimite : ""}" /></div>
    </div>
    <div class="field"><label>Presupuesto</label><input id="f-presupuesto" type="number" min="0" step="0.01" value="${p && p.presupuesto != null ? p.presupuesto : ""}" placeholder="Ej: 50000 (déjelo vacío si no aplica)" /></div>
    <div class="field"><label>Notas</label><textarea id="f-notas-p">${p && p.notas ? esc(p.notas) : ""}</textarea></div>
    <div class="row-end">
      <button class="btn" onclick="closeModal(); window.__openProyectoModalId = null;">Cerrar</button>
      <button class="btn primary" onclick="saveProyecto('${id || ""}')">Guardar</button>
    </div>
  `);
}

function packItemsText(items) {
  if (!items || items.length === 0) return "";
  return items.map((it) => `${it.cantidad} ${PRODUCTOS[it.producto] || it.producto}`).join(" + ");
}

function buildPiezasFromPack(pack) {
  const piezas = [];
  (pack.items || []).forEach((it) => {
    for (let i = 1; i <= (Number(it.cantidad) || 0); i++) {
      piezas.push({ tipo: it.producto, numero: i, entregada: false, link: "" });
    }
  });
  return piezas;
}

function buildGenericPiezas(n, entregadasIniciales) {
  const piezas = [];
  for (let i = 1; i <= n; i++) {
    piezas.push({ tipo: "pieza", numero: i, entregada: entregadasIniciales ? i <= entregadasIniciales : false, link: "" });
  }
  return piezas;
}

const ESTADOS_APROBACION = {
  sin_enviar: "Sin enviar",
  pendiente: "Pendiente de respuesta",
  aprobado: "Aprobado",
  cambios: "Cambios solicitados",
};

function piezaRowHtml(pz) {
  const label = pz.tipo === "pieza" ? `Pieza ${pz.numero}` : `${PRODUCTOS[pz.tipo] || pz.tipo} ${pz.numero}`;
  const estado = pz.estadoAprobacion || "sin_enviar";
  const tieneLink = !!(pz.link && pz.link.trim());
  return `
    <div class="pieza-row" data-proyecto-id="${pz.proyectoId}" data-pieza-id="${pz.id}" style="padding:8px 0;border-bottom:1px solid var(--border);">
      <div style="display:flex;align-items:center;gap:8px;">
        <input type="checkbox" class="pieza-check" ${pz.entregada ? "checked" : ""} style="width:auto;flex:none;" onchange="onPiezaEntregadaChange(this)" />
        <span class="pieza-label" style="min-width:100px;font-size:13px;">${esc(label)}</span>
        <input type="text" class="pieza-link" placeholder="Link del archivo (Drive, WeTransfer, etc.)" value="${escAttr(pz.link || "")}" onblur="onPiezaLinkBlur(this)" />
      </div>
      <div style="display:flex;align-items:center;gap:8px;margin-top:6px;margin-left:26px;flex-wrap:wrap;">
        <span class="badge ${estado}">${ESTADOS_APROBACION[estado]}</span>
        ${!tieneLink ? '<span class="muted" style="font-size:12px;">Cargue el link para poder enviar a aprobación</span>' : `
          <button type="button" class="btn small" onclick="shareWhatsApp(this)" title="Compartir por WhatsApp">WhatsApp</button>
          <button type="button" class="btn small" onclick="shareEmail(this)" title="Compartir por email">Email</button>
          <button type="button" class="btn small" onclick="shareRedes(this)" title="Compartir a otra red">Redes</button>
        `}
      </div>
      ${estado === "cambios" && pz.comentarioCambios ? `<div style="margin-left:26px;margin-top:6px;font-size:13px;color:var(--critical);">"${esc(pz.comentarioCambios)}"</div>` : ""}
    </div>
  `;
}

async function onPiezaEntregadaChange(checkbox) {
  const row = checkbox.closest(".pieza-row");
  const proyectoId = row.dataset.proyectoId;
  const piezaId = row.dataset.piezaId;
  try {
    await db.collection("proyectosSimple").doc(proyectoId).collection("piezas").doc(piezaId).update({ entregada: checkbox.checked });
  } catch (err) {
    alert("No se pudo guardar: " + err.message);
    checkbox.checked = !checkbox.checked;
  }
}

async function onPiezaLinkBlur(input) {
  const row = input.closest(".pieza-row");
  const proyectoId = row.dataset.proyectoId;
  const piezaId = row.dataset.piezaId;
  const valor = input.value.trim();
  try {
    await db.collection("proyectosSimple").doc(proyectoId).collection("piezas").doc(piezaId).update({ link: valor });
    const existente = state.piezas.find((p) => p.id === piezaId && p.proyectoId === proyectoId);
    if (existente) existente.link = valor;
  } catch (err) {
    alert("No se pudo guardar el link: " + err.message);
  }
}

function approvalUrl(proyectoId, piezaId) {
  const base = window.location.href.replace(/index\.html.*$/, "").replace(/\?.*$/, "");
  return base + `aprobacion-pieza.html?p=${proyectoId}&z=${piezaId}`;
}

async function markEnviadaSiCorresponde(proyectoId, piezaId, row) {
  const badge = row.querySelector(".badge");
  const estadoActual = badge ? badge.className.replace("badge ", "").trim() : "sin_enviar";
  if (estadoActual === "sin_enviar" || estadoActual === "cambios") {
    await db.collection("proyectosSimple").doc(proyectoId).collection("piezas").doc(piezaId).update({
      estadoAprobacion: "pendiente",
      comentarioCambios: "",
    });
  }
}

function getPiezaContextFromButton(btn) {
  const row = btn.closest(".pieza-row");
  const proyectoId = row.dataset.proyectoId;
  const piezaId = row.dataset.piezaId;
  const link = row.querySelector(".pieza-link").value.trim();
  const label = row.querySelector(".pieza-label").textContent.trim();
  return { row, proyectoId, piezaId, link, label };
}

async function shareWhatsApp(btn) {
  const { row, proyectoId, piezaId, link, label } = getPiezaContextFromButton(btn);
  if (!link) { alert("Primero cargue el link de esta pieza."); return; }
  await markEnviadaSiCorresponde(proyectoId, piezaId, row);
  const aprobUrl = approvalUrl(proyectoId, piezaId);
  const text = encodeURIComponent(`${label}\nVer contenido: ${link}\nAprobar o pedir cambios acá: ${aprobUrl}`);
  window.open(`https://wa.me/?text=${text}`, "_blank");
}

async function shareEmail(btn) {
  const { row, proyectoId, piezaId, link, label } = getPiezaContextFromButton(btn);
  if (!link) { alert("Primero cargue el link de esta pieza."); return; }
  await markEnviadaSiCorresponde(proyectoId, piezaId, row);
  const aprobUrl = approvalUrl(proyectoId, piezaId);
  const subject = encodeURIComponent(label);
  const body = encodeURIComponent(`Ver contenido: ${link}\n\nAprobar o pedir cambios acá: ${aprobUrl}`);
  window.location.href = `mailto:?subject=${subject}&body=${body}`;
}

async function shareRedes(btn) {
  const { row, proyectoId, piezaId, link, label } = getPiezaContextFromButton(btn);
  if (!link) { alert("Primero cargue el link de esta pieza."); return; }
  await markEnviadaSiCorresponde(proyectoId, piezaId, row);
  const aprobUrl = approvalUrl(proyectoId, piezaId);
  if (navigator.share) {
    try {
      await navigator.share({ title: label, text: `${label} — aprobar o pedir cambios:`, url: aprobUrl });
    } catch (e) {
      // canceló el menú de compartir
    }
  } else {
    try {
      await navigator.clipboard.writeText(aprobUrl);
      alert("Link de aprobación copiado. Péguelo donde quiera compartirlo.");
    } catch (e) {
      alert("No se pudo compartir automáticamente. Copie el link manualmente:\n" + aprobUrl);
    }
  }
}

async function migrateOldPiezas(proyecto) {
  const col = db.collection("proyectosSimple").doc(proyecto.id).collection("piezas");
  const batch = db.batch();
  proyecto.piezas.forEach((pz) => {
    const ref = col.doc();
    batch.set(ref, {
      tipo: pz.tipo,
      numero: pz.numero,
      entregada: !!pz.entregada,
      link: pz.link || "",
      estadoAprobacion: "sin_enviar",
      comentarioCambios: "",
      vistoPorMi: true,
      proyectoDescripcion: proyecto.descripcion,
      clienteNombre: clienteNombre(proyecto.clienteId),
      ownerId: user.uid,
      createdAt: firebase.firestore.FieldValue.serverTimestamp(),
    });
  });
  await batch.commit();
  await db.collection("proyectosSimple").doc(proyecto.id).update({ piezas: firebase.firestore.FieldValue.delete() });
  const snap = await col.where("ownerId", "==", user.uid).get();
  state.piezas = state.piezas
    .filter((p) => p.proyectoId !== proyecto.id)
    .concat(snap.docs.map((d) => ({ id: d.id, proyectoId: proyecto.id, ...d.data() })));
}

async function generatePiezasChecklistAsync(proyectoId, clienteId, descripcion, packId, cantidadManual, replace) {
  let piezasDef;
  if (packId) {
    const pack = state.packs.find((x) => x.id === packId);
    piezasDef = pack ? buildPiezasFromPack(pack) : [];
  } else {
    piezasDef = buildGenericPiezas(cantidadManual || 0);
  }
  if (piezasDef.length === 0) return false;

  const col = db.collection("proyectosSimple").doc(proyectoId).collection("piezas");
  const batch = db.batch();
  if (replace) {
    // consultamos Firestore directo (no la copia local, que puede estar desactualizada)
    // para asegurarnos de borrar TODO lo viejo antes de crear lo nuevo y evitar duplicados
    let existingSnap;
    try {
      existingSnap = await col.where("ownerId", "==", user.uid).get();
    } catch (err) {
      throw new Error(`No se pudo revisar las piezas existentes antes de reemplazar: ${err.message}`);
    }
    existingSnap.docs.forEach((d) => batch.delete(d.ref));
  }
  const clienteNombreVal = clienteNombre(clienteId);
  piezasDef.forEach((pz) => {
    const ref = col.doc();
    batch.set(ref, {
      tipo: pz.tipo,
      numero: pz.numero,
      entregada: false,
      link: "",
      estadoAprobacion: "sin_enviar",
      comentarioCambios: "",
      vistoPorMi: true,
      proyectoDescripcion: descripcion,
      clienteNombre: clienteNombreVal,
      ownerId: user.uid,
      createdAt: firebase.firestore.FieldValue.serverTimestamp(),
    });
  });
  try {
    await batch.commit();
  } catch (err) {
    throw new Error(`Al crear las piezas (uid=${user && user.uid ? user.uid : "sin-uid"}): ${err.message}`);
  }

  let snap;
  try {
    snap = await col.where("ownerId", "==", user.uid).get();
  } catch (err) {
    throw new Error(`Las piezas se crearon pero no se pudieron releer: ${err.message}`);
  }
  state.piezas = state.piezas
    .filter((p) => p.proyectoId !== proyectoId)
    .concat(snap.docs.map((d) => ({ id: d.id, proyectoId, ...d.data() })));
  return true;
}

async function onGenerarChecklistClick(id) {
  if (!id) return;
  const existing = piezasForProyecto(id);
  if (existing.length > 0) {
    if (!confirm('Esto reemplaza el checklist actual (se pierden las marcas, links y respuestas de aprobación ya cargadas). ¿Continuar?')) return;
  }
  try {
    const packId = document.getElementById("f-pack").value || null;
    const cantidad = parseInt(document.getElementById("f-totales").value, 10) || 0;
    const clienteId = document.getElementById("f-cliente").value;
    const descripcion = document.getElementById("f-descripcion").value.trim();
    const ok = await generatePiezasChecklistAsync(id, clienteId, descripcion, packId, cantidad, true);
    if (!ok) { alert("Elija un plan, o ingrese una cantidad mayor a 0."); return; }
    await openProyectoModal(id, true);
  } catch (err) {
    alert("No se pudo generar el checklist: " + err.message);
  }
}

function onProyectoPackChange() {
  const packId = document.getElementById("f-pack").value;
  if (!packId) return;
  const pack = state.packs.find((x) => x.id === packId);
  if (!pack) return;
  const total = (pack.items || []).reduce((sum, it) => sum + (Number(it.cantidad) || 0), 0);
  document.getElementById("f-totales").value = total;
}

async function saveProyecto(id) {
  const descripcion = document.getElementById("f-descripcion").value.trim();
  if (!descripcion) { alert("Ingrese la descripción del proyecto."); return; }
  const packId = document.getElementById("f-pack").value || null;
  const pack = packId ? state.packs.find((x) => x.id === packId) : null;
  const clienteId = document.getElementById("f-cliente").value;

  const presupuestoVal = document.getElementById("f-presupuesto").value;
  const data = {
    clienteId,
    descripcion,
    packId,
    packNombre: pack ? pack.nombre : null,
    estado: document.getElementById("f-estado").value,
    fechaLimite: document.getElementById("f-fecha").value || null,
    presupuesto: presupuestoVal === "" ? null : parseFloat(presupuestoVal),
    notas: document.getElementById("f-notas-p").value.trim(),
  };

  try {
    if (id) {
      await db.collection("proyectosSimple").doc(id).update(data);
      closeModal();
      window.__openProyectoModalId = null;
      await loadAll();
    } else {
      data.ownerId = user.uid;
      data.createdAt = firebase.firestore.FieldValue.serverTimestamp();
      const ref = await db.collection("proyectosSimple").add(data);
      const cantidad = parseInt(document.getElementById("f-totales").value, 10) || 0;
      await generatePiezasChecklistAsync(ref.id, clienteId, descripcion, packId, cantidad, false);
      closeModal();
      await loadAll();
      openProyectoModal(ref.id);
    }
  } catch (err) {
    alert("No se pudo guardar el proyecto: " + err.message);
  }
}

async function deleteProyecto(id) {
  if (!confirm("¿Borrar este proyecto? También se borran sus piezas.")) return;
  const piezas = piezasForProyecto(id);
  const batch = db.batch();
  const col = db.collection("proyectosSimple").doc(id).collection("piezas");
  piezas.forEach((pz) => batch.delete(col.doc(pz.id)));
  batch.delete(db.collection("proyectosSimple").doc(id));
  await batch.commit();
  window.__openProyectoModalId = null;
  await loadAll();
}

function openPackModal(id) {
  const p = id ? state.packs.find((x) => x.id === id) : null;
  const initialItems = p && p.items && p.items.length ? p.items : [{ producto: "reels", cantidad: 1 }];
  openModal(`

      <div class="field"><label>Frecuencia</label>

  `);

async function savePack(id) {
  const nombre = document.getElementById("f-pack-nombre").value.trim();
  if (!nombre) { alert("Ingrese el nombre del pack."); return; }

  const items = Array.from(document.querySelectorAll("#pack-items .pack-item-row")).map((row) => ({
    producto: row.querySelector(".pack-item-producto").value,
    cantidad: parseInt(row.querySelector(".pack-item-cantidad").value, 10) || 0,
  })).filter((it) => it.cantidad > 0);

  if (items.length === 0) { alert("Agregue al menos un producto con cantidad mayor a 0."); return; }

  const precioVal = document.getElementById("f-pack-precio").value;
  const data = {
    nombre,
    items,
    precio: precioVal === "" ? null : parseFloat(precioVal),
    frecuencia: document.getElementById("f-pack-frecuencia").value,
    notas: document.getElementById("f-pack-notas").value.trim(),
  };
  if (id) {
    await db.collection("packs").doc(id).update(data);
  } else {
    data.ownerId = user.uid;
    data.createdAt = firebase.firestore.FieldValue.serverTimestamp();
    await db.collection("packs").add(data);
  }
  closeModal();
  await loadAll();
}

async function deletePack(id) {
  if (!confirm("¿Borrar este pack?")) return;
  await db.collection("packs").doc(id).delete();
  await loadAll();
}

  const diseno = document.getElementById("f-pd-diseno").value.trim();
  if (!diseno) { alert("Ingrese el diseño / descripción del proyecto."); return; }
  const num = (elId) => {
    const v = document.getElementById(elId).value;
    return v === "" ? null : parseFloat(v);
  };
  const tipoEvento = document.getElementById("f-pd-tipoevento").value || null;
  const data = {
    clienteId: document.getElementById("f-pd-cliente").value,
    diseno,
    costoTela: num("f-pd-tela"),
    costoManoObra: num("f-pd-manoobra"),
    costoInsumos: num("f-pd-insumos"),
    precio: num("f-pd-precio"),

function compressImageFile(file, maxDim, quality) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = (e) => {
      const img = new Image();
      img.onload = () => {
        let w = img.width, h = img.height;
        if (w > maxDim || h > maxDim) {
          if (w > h) { h = Math.round((h * maxDim) / w); w = maxDim; }
          else { w = Math.round((w * maxDim) / h); h = maxDim; }
        }
        const canvas = document.createElement("canvas");
        canvas.width = w; canvas.height = h;
        canvas.getContext("2d").drawImage(img, 0, 0, w, h);
        resolve(canvas.toDataURL("image/jpeg", quality || 0.72));
      };
      img.onerror = () => reject(new Error("No se pudo leer la imagen."));
      img.src = e.target.result;
    };
    reader.onerror = () => reject(new Error("No se pudo leer el archivo."));
    reader.readAsDataURL(file);
  });
}

      const dataUrl = await compressImageFile(file, 1000, 0.72);
      await db
        .collection("proyectosDesign")
        .doc(proyectoId)
        .collection("fotos")
        .add({
          categoria,
          data: dataUrl,
          ownerId: user.uid,
          createdAt: firebase.firestore.FieldValue.serverTimestamp(),
          createdAtMillis: Date.now(),

    await loadFotosProyecto(proyectoId);
    renderDetalleDesign(proyectoId);
  } catch (err) {
    alert("No se pudo subir alguna foto: " + err.message);

// ------------------------------------------------------------
// Laila Design: generador de presupuesto (imagen + PDF con marca)
// ------------------------------------------------------------
function wrapPdfText(ctx, text, x, y, maxWidth, lineHeight) {
  const words = String(text).split(" ");
  let line = "";
  let curY = y;
  words.forEach((word) => {
    const test = line + word + " ";
    if (ctx.measureText(test).width > maxWidth && line !== "") {
      ctx.fillText(line, x, curY);
      line = word + " ";
      curY += lineHeight;
    } else {
      line = test;
    }
  });
  ctx.fillText(line, x, curY);
  return curY;
}

function buildPresupuestoCanvas(p, cliente) {
  const canvas = document.createElement("canvas");
  canvas.width = 700;
  canvas.height = 900;
  const ctx = canvas.getContext("2d");

  ctx.fillStyle = "#f2ebdd";
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  ctx.fillStyle = "#6b6152";
  ctx.fillRect(0, 0, canvas.width, 130);
  ctx.fillStyle = "#faf6ee";
  ctx.font = "bold 40px sans-serif";
  ctx.fillText("LAILA DESIGN", 40, 65);
  ctx.font = "20px sans-serif";
  ctx.fillText("@__lailadesign", 40, 100);

  ctx.fillStyle = "#332e26";
  ctx.font = "bold 26px sans-serif";
  ctx.fillText("Presupuesto", 40, 175);

  let y = 235;
  const campos = [
    ["Cliente", cliente],
    ["Diseño", p.diseno],
    ["Plazo de entrega", p.plazoEntrega ? formatDate(p.plazoEntrega) : "A confirmar"],
    ["Precio", p.precio != null ? formatMoney(p.precio) : "A confirmar"],
  ];
  campos.forEach(([label, val]) => {
    ctx.fillStyle = "#83786a";
    ctx.font = "15px sans-serif";
    ctx.fillText(label.toUpperCase(), 40, y);
    ctx.fillStyle = "#332e26";
    ctx.font = "bold 24px sans-serif";
    ctx.fillText(String(val), 40, y + 30);
    y += 78;
  });

  if (p.notas) {
    ctx.fillStyle = "#83786a";
    ctx.font = "15px sans-serif";
    ctx.fillText("NOTAS", 40, y);
    ctx.fillStyle = "#332e26";
    ctx.font = "17px sans-serif";
    wrapPdfText(ctx, p.notas, 40, y + 26, canvas.width - 80, 22);
  }

  ctx.fillStyle = "#83786a";
  ctx.font = "13px sans-serif";
  ctx.fillText("Generado el " + new Date().toLocaleDateString("es-AR"), 40, canvas.height - 30);

  return canvas;
}

async function generatePresupuestoPDF(id) {
  const p = state.proyectosDesign.find((x) => x.id === id);
  if (!p) return;
  const cliente = clienteDesignNombre(p.clienteId);
  try {
    const canvas = buildPresupuestoCanvas(p, cliente);
    const imgData = canvas.toDataURL("image/jpeg", 0.85);
    const { jsPDF } = window.jspdf;
    const pdf = new jsPDF({ orientation: "portrait", unit: "px", format: [canvas.width, canvas.height] });
    pdf.addImage(imgData, "JPEG", 0, 0, canvas.width, canvas.height);
    const pdfDataUri = pdf.output("datauristring");

    await db
      .collection("proyectosDesign")
      .doc(id)
      .collection("presupuestos")
      .add({
        pdfData: pdfDataUri,
        cliente,
        diseno: p.diseno,
        precio: p.precio,
        plazoEntrega: p.plazoEntrega,
        ownerId: user.uid,
        createdAt: firebase.firestore.FieldValue.serverTimestamp(),
        createdAtMillis: Date.now(),
      });

    pdf.save(`presupuesto-${cliente}-${p.diseno}.pdf`.replace(/\s+/g, "_"));
    await loadPresupuestosProyecto(id);
    renderDetalleDesign(id);
  } catch (err) {
    alert("No se pudo generar el presupuesto: " + err.message);
  }
}

function downloadDataUri(dataUri, filename) {
  const a = document.createElement("a");
  a.href = dataUri;
  a.download = filename;
  a.click();
}

function downloadPresupuesto(proyectoId, presId) {
  const pres = (__presupuestosCache[proyectoId] || []).find((x) => x.id === presId);
  if (!pres) return;
  downloadDataUri(pres.pdfData, `presupuesto-${pres.cliente}.pdf`.replace(/\s+/g, "_"));
}

function sharePresupuestoWhatsApp(proyectoId, presId) {
  const pres = (__presupuestosCache[proyectoId] || []).find((x) => x.id === presId);
  if (!pres) return;
  downloadDataUri(pres.pdfData, `presupuesto-${pres.cliente}.pdf`.replace(/\s+/g, "_"));
  const text = encodeURIComponent(`Presupuesto para ${pres.cliente} — ${pres.diseno}. Te acabo de descargar el PDF a tu aparato, adjuntalo acá en el chat.`);
  window.open(`https://wa.me/?text=${text}`, "_blank");
}

function sharePresupuestoEmail(proyectoId, presId) {
  const pres = (__presupuestosCache[proyectoId] || []).find((x) => x.id === presId);
  if (!pres) return;
  downloadDataUri(pres.pdfData, `presupuesto-${pres.cliente}.pdf`.replace(/\s+/g, "_"));
  const subject = encodeURIComponent(`Presupuesto — ${pres.diseno}`);
  const body = encodeURIComponent(`Hola ${pres.cliente}, te comparto el presupuesto. Adjunto el PDF que se acaba de descargar a este aparato.`);
  window.location.href = `mailto:?subject=${subject}&body=${body}`;
}

async function loadFotosCliente(clienteId) {
  const proyectos = state.proyectosDesign.filter((p) => !clienteId || p.clienteId === clienteId);
  const snaps = await Promise.all(
    proyectos.map((p) => db.collection("proyectosDesign").doc(p.id).collection("fotos").where("ownerId", "==", user.uid).get())
  );
  const fotos = [];
  proyectos.forEach((p, i) => {
    snaps[i].docs.forEach((d) =>
      fotos.push({
        id: d.id,
        proyectoId: p.id,
        proyectoDiseno: p.diseno,
        clienteId: p.clienteId,
        tipoEvento: p.tipoEvento || "",
        tipoEventoLabel: tipoEventoLabel(p),
        colores: p.colores || "",
        ...d.data(),
      })
    );
    __fotosCache[p.id] = snaps[i].docs.map((d) => ({ id: d.id, ...d.data() }));
  });
  return fotos;
}

function renderPortfolioBuilderFotos() {
  const root = document.getElementById("portfolio-fotos-root");
  if (!root) return;
  if (__portfolioBuilderFotos.length === 0) {
    root.innerHTML = '<span class="muted">No hay fotos cargadas todavía para esta selección.</span>';
    return;
  }

  const tiposPresentes = [...new Set(__portfolioBuilderFotos.map((f) => f.tipoEvento).filter(Boolean))];
  const filtradas = __portfolioBuilderFotos.filter((f) => {
    if (__portfolioFiltroTipoEvento && f.tipoEvento !== __portfolioFiltroTipoEvento) return false;
    if (__portfolioFiltroColor && !(f.colores || "").toLowerCase().includes(__portfolioFiltroColor.toLowerCase())) return false;
    return true;
  });
  const seleccionadasVisibles = filtradas.filter((f) => __portfolioBuilderSeleccion.has(f.proyectoId + "_" + f.id)).length;

  root.innerHTML = `
    <div class="field-row">
      <div class="field"><label>Desglosar por tipo de evento</label>
        <select id="f-pf-tipoevento" onchange="onPortfolioFiltroChange()">
          <option value="">Todos</option>
          ${tiposPresentes.map((t) => `<option value="${t}" ${__portfolioFiltroTipoEvento === t ? "selected" : ""}>${esc(TIPOS_EVENTO[t] || t)}</option>`).join("")}
        </select>
      </div>
      <div class="field"><label>Desglosar por color</label><input id="f-pf-color" value="${escAttr(__portfolioFiltroColor)}" placeholder="Ej: rojo" oninput="onPortfolioFiltroChange()" /></div>
    </div>
    <label>Fotos a incluir (${seleccionadasVisibles} de ${filtradas.length} visibles seleccionadas)</label>
    <div style="display:flex;flex-wrap:wrap;gap:8px;">
      ${
        filtradas.length === 0
          ? '<span class="muted">Ninguna foto coincide con este filtro.</span>'
          : filtradas
              .map((f) => {
                const key = f.proyectoId + "_" + f.id;
                const checked = __portfolioBuilderSeleccion.has(key);
                const tip = [f.tipoEventoLabel, f.colores].filter(Boolean).join(" · ");
                return `
          <label style="position:relative;cursor:pointer;display:block;" title="${escAttr(tip)}">
            <img src="${f.data}" style="width:76px;height:76px;object-fit:cover;border-radius:6px;border:2px solid ${checked ? "var(--accent)" : "var(--border)"};" />
            <input type="checkbox" ${checked ? "checked" : ""} style="position:absolute;top:2px;left:2px;width:auto;" onchange="togglePortfolioFoto('${key}')" />
          </label>`;
              })
              .join("")
      }
    </div>
  `;
}

function onPortfolioFiltroChange() {
  __portfolioFiltroTipoEvento = document.getElementById("f-pf-tipoevento").value;
  __portfolioFiltroColor = document.getElementById("f-pf-color").value.trim();
  renderPortfolioBuilderFotos();
}

function togglePortfolioFoto(key) {
  if (__portfolioBuilderSeleccion.has(key)) __portfolioBuilderSeleccion.delete(key);
  else __portfolioBuilderSeleccion.add(key);
  renderPortfolioBuilderFotos();
}

async function savePortfolio() {
  const titulo = document.getElementById("f-pf-titulo").value.trim();
  if (!titulo) { alert("Ingrese un título para el portfolio."); return; }
  if (__portfolioBuilderSeleccion.size === 0) { alert("Seleccione al menos una foto."); return; }
  const clienteId = document.getElementById("f-pf-cliente").value || null;
  const seleccionadas = __portfolioBuilderFotos.filter((f) => __portfolioBuilderSeleccion.has(f.proyectoId + "_" + f.id));
  const refs = seleccionadas.map((f) => ({ proyectoId: f.proyectoId, fotoId: f.id, categoria: f.categoria }));
  try {
    await db.collection("portfoliosDesign").add({
      titulo,
      clienteId,
      fotosRefs: refs,
      ownerId: user.uid,
      createdAt: firebase.firestore.FieldValue.serverTimestamp(),
      createdAtMillis: Date.now(),
    });
    closeModal();
    await loadAll();
    await generatePortfolioPDF(null, seleccionadas, titulo);
  } catch (err) {
    alert("No se pudo guardar el portfolio: " + err.message);
  }
}

async function generatePortfolioPDF(portfolioId, fotosDirectas, tituloDirecto) {
  let fotosData = fotosDirectas;
  let titulo = tituloDirecto;
  try {
    if (!fotosData) {
      const pf = state.portfolios.find((x) => x.id === portfolioId);
      if (!pf) return;
      titulo = pf.titulo;
      const proyectoIds = [...new Set((pf.fotosRefs || []).map((r) => r.proyectoId))];
      await Promise.all(proyectoIds.map((pid) => (!__fotosCache[pid] ? loadFotosProyecto(pid) : Promise.resolve())));
      fotosData = pf.fotosRefs
        .map((r) => {
          const foto = (__fotosCache[r.proyectoId] || []).find((f) => f.id === r.fotoId);
          return foto ? { ...foto, proyectoId: r.proyectoId } : null;
        })
        .filter(Boolean);
    }
    if (fotosData.length === 0) { alert("Este portfolio no tiene fotos disponibles (puede que se hayan borrado de los proyectos originales)."); return; }

    const { jsPDF } = window.jspdf;
    const pdf = new jsPDF({ orientation: "portrait", unit: "px", format: [700, 900] });

    pdf.setFillColor(242, 235, 221);
    pdf.rect(0, 0, 700, 900, "F");
    pdf.setFillColor(107, 97, 82);
    pdf.rect(0, 0, 700, 130, "F");
    pdf.setTextColor(250, 246, 238);
    pdf.setFontSize(34);
    pdf.text("LAILA DESIGN", 40, 60);
    pdf.setFontSize(16);
    pdf.text("@__lailadesign", 40, 95);
    pdf.setTextColor(51, 46, 38);
    pdf.setFontSize(24);
    pdf.text(String(titulo), 40, 175);
    pdf.setFontSize(12);
    pdf.setTextColor(131, 120, 106);
    pdf.text("Portfolio generado el " + new Date().toLocaleDateString("es-AR"), 40, 205);

    for (let i = 0; i < fotosData.length; i += 2) {
      pdf.addPage([700, 900]);
      pdf.setFillColor(242, 235, 221);
      pdf.rect(0, 0, 700, 900, "F");
      const par = fotosData.slice(i, i + 2);
      par.forEach((foto, idx) => {
        const y = 40 + idx * 430;
        try {
          pdf.addImage(foto.data, "JPEG", 40, y, 620, 380);
        } catch (e) {
          // si una foto individual falla, seguimos con el resto
        }
        pdf.setFontSize(12);
        pdf.setTextColor(131, 120, 106);
        pdf.text(CATEGORIAS_FOTO[foto.categoria] || foto.categoria || "", 40, y + 400);
      });
    }

    const dataUri = pdf.output("datauristring");
    downloadDataUri(dataUri, `portfolio-${titulo}.pdf`.replace(/\s+/g, "_"));
    return dataUri;
  } catch (err) {
    alert("No se pudo generar el portfolio en PDF: " + err.message);
  }
}

    return;
  }
  const actuales = [
    document.getElementById("pp-color1")?.value,
    document.getElementById("pp-color2")?.value,
    document.getElementById("pp-color3")?.value,
  ];
  root.innerHTML = state.paletas
    .map((p) => {
