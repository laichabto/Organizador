  const base = { modulo, clienteId, clienteNombre: clienteNombreVal, colores: [color1, color2, color3], fuenteKey, diasSeguimiento, diasValidez, diasAvisoVencimiento };

  if (modulo === "contenido") {
    const alcance = document.getElementById("pp-alcance").value.trim();
    const rubro = document.getElementById("pp-rubro").value;
    let scopeNombre, precio;
    if (__presupuestadorPackSeleccionado === "personalizado") {
      scopeNombre = document.getElementById("pp-personalizado-nombre").value.trim() || "Pack personalizado";
      const precioVal = document.getElementById("pp-personalizado-precio").value;
      precio = precioVal === "" ? null : parseFloat(precioVal);
    } else if (__presupuestadorPackSeleccionado) {
      const pack = state.packs.find((p) => p.id === __presupuestadorPackSeleccionado);
      scopeNombre = pack ? pack.nombre : "Pack";
      precio = pack ? pack.precio : null;
    } else {
      alert("Elija un pack, o toque 'Personalizado' para armar uno a medida.");
      return null;
    }
    return { ...base, scopeNombre, precio, alcance, rubro };
  } else {
    const tipoEvento = document.getElementById("pp-tipoevento").value;
    const alcance = document.getElementById("pp-alcance").value.trim();
    const precioVal = document.getElementById("pp-precio").value;
    const precio = precioVal === "" ? null : parseFloat(precioVal);
    return { ...base, tipoEvento, alcance, precio, scopeNombre: TIPOS_EVENTO[tipoEvento] || "Diseño a medida" };
  }
}

function hexToRgba(hex, alpha) {
  const h = String(hex || "#6b6152").replace("#", "");
  const full = h.length === 3 ? h.split("").map((c) => c + c).join("") : h;
  const bigint = parseInt(full, 16) || 0;
  const r = (bigint >> 16) & 255, g = (bigint >> 8) & 255, b = bigint & 255;
  return `rgba(${r},${g},${b},${alpha})`;
}

// Arma la pieza gráfica como HTML/CSS real (gradientes, sombras, tipografía
// con line-height correcto) y la rasteriza con html2canvas. Da un resultado
// mucho más prolijo que dibujar formas a mano sobre un <canvas>.
async function buildPresupuestadorCanvas(modulo, datos) {
  const fuente = FUENTES_PRESUPUESTO[datos.fuenteKey] || FUENTES_PRESUPUESTO.montserrat;
  try {
    await Promise.all([
      document.fonts.load(`800 48px ${fuente.css}`),
      document.fonts.load(`700 30px ${fuente.css}`),
      document.fonts.load(`700 30px 'Dancing Script'`),
      document.fonts.load(`600 15px ${fuente.css}`),
      document.fonts.load(`400 16px ${fuente.css}`),
      document.fonts.load(`400 16px 'Poppins'`),
      document.fonts.load(`600 16px 'Poppins'`),
      document.fonts.load(`800 58px 'Playfair Display'`),
      document.fonts.load(`700 15px 'Playfair Display'`),
      document.fonts.load(`600 15px 'Playfair Display'`),
    ]);
    await document.fonts.ready;
  } catch (e) {
    // si falla la carga de la fuente, seguimos con la que haya disponible
  }

  const brand = state.brandConfig[modulo] || {};
  const nombreMarca = brand.nombreMarca || (modulo === "design" ? "Laila Design" : "Mi Marca");
  const igDefault = modulo === "design" ? "@__lailadesign" : "";
  const instagram = brand.instagram || igDefault;
  const [c1, c2, c3] = datos.colores;
  const iconoInfo = modulo === "contenido" ? RUBROS_CONTENIDO[datos.rubro] || RUBROS_CONTENIDO.otro : FRASES_EVENTO[datos.tipoEvento] || FRASES_EVENTO.otro;

  const contactos = [];
  if (brand.whatsapp) contactos.push(`<span>WHATSAPP &nbsp;${esc(brand.whatsapp)}</span>`);
  if (instagram) contactos.push(`<span>INSTAGRAM &nbsp;${esc(instagram)}</span>`);
  if (brand.email) contactos.push(`<span>EMAIL &nbsp;${esc(brand.email)}</span>`);

  const diasValidez = datos.diasValidez || 0;
  const fechaValidezTexto = diasValidez > 0
    ? new Date(Date.now() + diasValidez * 86400000).toLocaleDateString("es-AR", { day: "2-digit", month: "2-digit", year: "numeric" })
    : null;

  const wrapper = document.createElement("div");
  wrapper.style.position = "fixed";
  wrapper.style.left = "-99999px";
  wrapper.style.top = "0";
  wrapper.style.zIndex = "-1";
  // La tipografía elegida por la usuaria (a veces decorativa/cursiva) se usa
  // SOLO en títulos cortos. El cuerpo de texto (párrafos, pie, etiquetas)
  // siempre usa una tipografía fija y legible, sin importar lo que elija.
  const fuenteCuerpo = "'Poppins', -apple-system, sans-serif";

  const tituloTexto = (datos.scopeNombre || "Presupuesto").toUpperCase();
  const tituloSize = tituloTexto.length > 26 ? 32 : tituloTexto.length > 16 ? 42 : 52;
  const contactosSeparados = contactos.join(`<span style="opacity:0.3;padding:0 14px;">|</span>`);
  const filete = `<div style="display:flex;align-items:center;justify-content:center;gap:10px;">
      <div style="height:1px;flex:1;max-width:150px;background:${hexToRgba(c1, 0.35)};"></div>
      <div style="width:6px;height:6px;background:${c3};transform:rotate(45deg);"></div>
      <div style="height:1px;flex:1;max-width:150px;background:${hexToRgba(c1, 0.35)};"></div>
    </div>`;
  const corner = (top, right, bottom, left) => `position:absolute;${top !== undefined ? `top:${top}px;` : ""}${right !== undefined ? `right:${right}px;` : ""}${bottom !== undefined ? `bottom:${bottom}px;` : ""}${left !== undefined ? `left:${left}px;` : ""}width:26px;height:26px;border-top:${top !== undefined ? `1.5px solid ${hexToRgba(c1, 0.55)}` : "none"};border-bottom:${bottom !== undefined ? `1.5px solid ${hexToRgba(c1, 0.55)}` : "none"};border-left:${left !== undefined ? `1.5px solid ${hexToRgba(c1, 0.55)}` : "none"};border-right:${right !== undefined ? `1.5px solid ${hexToRgba(c1, 0.55)}` : "none"};`;

  wrapper.innerHTML = `
    <div style="width:760px;font-family:${fuenteCuerpo};background:${c2};position:relative;box-shadow:0 25px 60px rgba(0,0,0,0.16);">
      <div style="${corner(22, undefined, undefined, 22)}"></div>
      <div style="${corner(22, 22, undefined, undefined)}"></div>
      <div style="${corner(undefined, undefined, 22, 22)}"></div>
      <div style="${corner(undefined, 22, 22, undefined)}"></div>

      <div style="position:relative;padding:70px 64px 6px;text-align:center;">
        <div style="font-family:'Playfair Display',serif;font-size:13px;font-weight:700;letter-spacing:5px;color:${hexToRgba(c1, 0.75)};margin-bottom:34px;">
          ${esc(nombreMarca.toUpperCase())}${instagram ? `<span style="opacity:0.45;"> &nbsp;—&nbsp; </span>${esc(instagram)}` : ""}
        </div>

        <div style="font-family:'Playfair Display',serif;font-weight:800;font-size:${tituloSize}px;line-height:1.1;color:${c1};letter-spacing:0.5px;padding:0 10px;">
          ${esc(tituloTexto)}
        </div>

        <div style="margin:26px 0 24px;">${filete}</div>

        <div style="font-family:'Playfair Display',serif;font-size:14px;font-weight:600;letter-spacing:3.5px;color:${hexToRgba(c1, 0.8)};">
          PRESUPUESTO PARA ${esc(datos.clienteNombre.toUpperCase())}
        </div>

        ${
          modulo === "design" && iconoInfo.frase
            ? `<div style="font-family:'Dancing Script',cursive;font-size:26px;font-weight:700;color:${c1};margin:24px 40px 0;line-height:1.3;">${esc(iconoInfo.frase)}</div>`
            : ""
        }
      </div>

      ${
        datos.alcance
          ? `
      <div style="position:relative;padding:36px 64px 0;text-align:left;">
        <div style="font-size:11.5px;letter-spacing:3px;font-weight:600;color:${hexToRgba(c1, 0.7)};border-left:2px solid ${c3};padding-left:12px;">DETALLE DEL SERVICIO</div>
        <div style="font-size:16.5px;color:#2a2318;margin-top:14px;line-height:1.65;">${esc(datos.alcance)}</div>
      </div>`
          : ""
      }

      ${
        datos.precio != null
          ? `
      <div style="position:relative;text-align:center;padding:40px 64px 6px;">
        ${filete}
        <div style="font-family:'Playfair Display',serif;font-size:12.5px;letter-spacing:4px;font-weight:700;color:${hexToRgba(c1, 0.7)};margin:20px 0 8px;">INVERSIÓN</div>
        <div style="font-family:'Playfair Display',serif;font-size:46px;font-weight:800;color:${c1};letter-spacing:0.5px;">${esc(formatMoney(datos.precio))}</div>
        <div style="margin-top:20px;">${filete}</div>
      </div>`
          : ""
      }

      ${
        fechaValidezTexto
          ? `<div style="position:relative;text-align:center;font-size:12px;letter-spacing:0.8px;color:${hexToRgba(c1, 0.6)};padding-top:8px;">Presupuesto válido hasta el ${fechaValidezTexto}</div>`
          : ""
      }

      <div style="position:relative;text-align:center;font-style:italic;font-size:14.5px;color:${hexToRgba(c1, 0.65)};padding:22px 56px 50px;">Gracias por la confianza</div>

      <div style="position:relative;background:${hexToRgba(c1, 0.04)};border-top:1px solid ${hexToRgba(c1, 0.18)};padding:24px 40px;text-align:center;">
        <div style="font-family:'Playfair Display',serif;font-size:12.5px;letter-spacing:1.2px;color:${c1};font-weight:600;">${contactosSeparados || "Contacto a coordinar"}</div>
        <div style="font-size:11px;color:${hexToRgba(c1, 0.5)};margin-top:9px;letter-spacing:0.5px;">Presupuesto generado el ${new Date().toLocaleDateString("es-AR")}</div>
      </div>
    </div>
  `;
  document.body.appendChild(wrapper);

  try {
    await new Promise((resolve) => requestAnimationFrame(() => requestAnimationFrame(resolve)));
    const canvas = await html2canvas(wrapper.firstElementChild, { scale: 2, backgroundColor: null, useCORS: true });
    return canvas;
  } finally {
    wrapper.remove();
  }
}

async function generatePresupuestadorPreview(modulo) {
  try {
    const datos = collectPresupuestadorFormData(modulo);
    if (!datos) return;
    const canvas = await buildPresupuestadorCanvas(modulo, datos);
    const imgData = canvas.toDataURL("image/jpeg", 0.9);
    const { jsPDF } = window.jspdf;
    const pdf = new jsPDF({ orientation: "portrait", unit: "px", format: [canvas.width, canvas.height] });
    pdf.addImage(imgData, "JPEG", 0, 0, canvas.width, canvas.height);
    __presupuestadorPdfDataUri = pdf.output("datauristring");
    __presupuestadorScopeSeleccion = datos;

    document.getElementById("pp-preview-root").innerHTML = `
      <div class="field" style="text-align:center;">
        <img src="${imgData}" style="max-width:100%;border-radius:10px;border:1px solid var(--border);margin-bottom:10px;" />
        <div style="display:flex;gap:8px;flex-wrap:wrap;justify-content:center;">
          <button type="button" class="btn primary small" onclick="savePresupuestador('${modulo}')">Guardar en el historial</button>
          <button type="button" class="btn small" onclick="downloadDataUri(__presupuestadorPdfDataUri, 'presupuesto.pdf')">Descargar PDF</button>
          <button type="button" class="btn small" onclick="sharePresupuestadorPreviewWhatsApp()">WhatsApp</button>
          <button type="button" class="btn small" onclick="sharePresupuestadorPreviewEmail()">Email</button>
        </div>
      </div>
    `;
  } catch (err) {
    alert("No se pudo generar el presupuesto: " + err.message);
  }
}

function sharePresupuestadorPreviewWhatsApp() {
  if (!__presupuestadorPdfDataUri) return;
  downloadDataUri(__presupuestadorPdfDataUri, "presupuesto.pdf");
  const text = encodeURIComponent("Te acabo de descargar el presupuesto en PDF a tu aparato, adjuntalo acá en el chat.");
  window.open(`https://wa.me/?text=${text}`, "_blank");
}

function sharePresupuestadorPreviewEmail() {
  if (!__presupuestadorPdfDataUri) return;
  downloadDataUri(__presupuestadorPdfDataUri, "presupuesto.pdf");
  const subject = encodeURIComponent("Presupuesto");
  const body = encodeURIComponent("Te comparto el presupuesto. Adjunto el PDF que se acaba de descargar a este aparato.");
  window.location.href = `mailto:?subject=${subject}&body=${body}`;
}

async function savePresupuestador(modulo) {
  if (!__presupuestadorScopeSeleccion || !__presupuestadorPdfDataUri) { alert("Primero genere la vista previa."); return; }
  const datos = __presupuestadorScopeSeleccion;
  const diasSeguimiento = datos.diasSeguimiento || 0;
  const diasValidez = datos.diasValidez || 0;
  const diasAvisoVencimiento = datos.diasAvisoVencimiento || 0;
  const ahora = Date.now();
  const validoHastaMillis = diasValidez > 0 ? ahora + diasValidez * 86400000 : null;
  const avisoVencimientoMillis = validoHastaMillis && diasAvisoVencimiento > 0 ? validoHastaMillis - diasAvisoVencimiento * 86400000 : null;
  try {
    await db.collection("presupuestosGenerados").add({
      modulo,
      clienteId: datos.clienteId,
      clienteNombre: datos.clienteNombre,
      scopeNombre: datos.scopeNombre,
      alcance: datos.alcance || "",
      precio: datos.precio,
      rubro: datos.rubro || null,
      tipoEvento: datos.tipoEvento || null,
      colores: datos.colores,
      fuenteKey: datos.fuenteKey,
      pdfData: __presupuestadorPdfDataUri,
      estado: "enviado",
      diasSeguimiento,
      diasValidez,
      validoHastaMillis,
      diasAvisoVencimiento,
      avisoVencimientoMillis,
      fechaEnvioMillis: ahora,
      proximoSeguimientoMillis: diasSeguimiento > 0 ? ahora + diasSeguimiento * 86400000 : null,
      ownerId: user.uid,
      createdAt: firebase.firestore.FieldValue.serverTimestamp(),
      createdAtMillis: ahora,
    });
    closeModal();
    await loadAll();
  } catch (err) {
    alert("No se pudo guardar el presupuesto: " + err.message);
  }
}

function presupuestosParaModulo(modulo) {
  return (state.presupuestosGenerados || []).filter((p) => p.modulo === modulo);
}

function estadoPresupuestadorLabel(estado) {
  return { enviado: "Enviado", aprobado_pres: "Aprobado", rechazado_pres: "Rechazado" }[estado] || estado;
}

function renderPresupuestosTab(modulo) {
  const elId = modulo === "contenido" ? "tab-presupuestos" : "tab-presupuestosDesign";
  const el = document.getElementById(elId);
  if (!el) return;
  const list = presupuestosParaModulo(modulo);
  el.innerHTML = `
    <table>
      <thead><tr><th>Cliente</th><th>Detalle</th><th>Precio</th><th>Estado</th><th>Válido hasta</th><th>Seguimiento</th><th></th></tr></thead>
      <tbody id="presupuestos-tbody-${modulo}"></tbody>
    </table>
  `;
  const tbody = document.getElementById(`presupuestos-tbody-${modulo}`);
  if (list.length === 0) {
    tbody.innerHTML = `<tr class="empty-row"><td colspan="7">Todavía no generó ningún presupuesto acá.</td></tr>`;
    return;
  }
  const hoy = Date.now();
  tbody.innerHTML = list
    .map((p) => {
      const vencido = p.estado === "enviado" && p.proximoSeguimientoMillis && p.proximoSeguimientoMillis <= hoy;
      const validezVencida = p.estado === "enviado" && p.validoHastaMillis && p.validoHastaMillis <= hoy;
      const avisoVencimiento = p.estado === "enviado" && p.avisoVencimientoMillis && p.avisoVencimientoMillis <= hoy && !validezVencida;
      return `
    <tr>
      <td><strong>${esc(p.clienteNombre)}</strong></td>
      <td>${esc(p.scopeNombre || "")}${p.tipoEvento ? `<div class="muted">${esc(TIPOS_EVENTO[p.tipoEvento] || p.tipoEvento)}</div>` : ""}</td>
      <td>${p.precio != null ? formatMoney(p.precio) : '<span class="muted">-</span>'}</td>
      <td><span class="badge ${p.estado}">${estadoPresupuestadorLabel(p.estado)}</span></td>
      <td>${
        p.validoHastaMillis
          ? `<span style="${validezVencida ? "color:var(--critical);font-weight:600;" : avisoVencimiento ? "color:var(--warn);font-weight:600;" : ""}">${new Date(p.validoHastaMillis).toLocaleDateString("es-AR")}</span>`
          : '<span class="muted">Sin límite</span>'
      }</td>
      <td>${
        p.estado !== "enviado"
          ? '<span class="muted">-</span>'
          : p.proximoSeguimientoMillis
          ? `<span style="${vencido ? "color:var(--critical);font-weight:600;" : ""}">${new Date(p.proximoSeguimientoMillis).toLocaleDateString("es-AR")}</span>`
          : '<span class="muted">Sin recordatorio</span>'
      }</td>
      <td>
        <button class="btn small" onclick="downloadDataUriById('${p.id}')">Descargar</button>
        ${
          p.estado === "enviado"
            ? `
          <button class="btn small" onclick="marcarPresupuestadorEstado('${p.id}','aprobado_pres')">Aprobado</button>
          <button class="btn small" onclick="marcarPresupuestadorEstado('${p.id}','rechazado_pres')">Rechazado</button>
          <button class="btn small" onclick="reprogramarSeguimiento('${p.id}')">Reprogramar</button>
        `
            : ""
        }
        <button class="btn small danger" onclick="deletePresupuestador('${p.id}')">Borrar</button>
      </td>
    </tr>`;
    })
    .join("");
}

function downloadDataUriById(id) {
  const p = (state.presupuestosGenerados || []).find((x) => x.id === id);
  if (!p) return;
  downloadDataUri(p.pdfData, `presupuesto-${p.clienteNombre}.pdf`.replace(/\s+/g, "_"));
}

async function marcarPresupuestadorEstado(id, estado) {
  try {
    await db.collection("presupuestosGenerados").doc(id).update({ estado, proximoSeguimientoMillis: null });
    await loadAll();
  } catch (err) {
    alert("No se pudo actualizar: " + err.message);
  }
}

async function reprogramarSeguimiento(id) {
  const dias = prompt("¿En cuántos días quiere que se lo recuerde de nuevo?", "5");
  if (dias === null) return;
  const n = parseInt(dias, 10);
  if (!n || n <= 0) { alert("Ingrese un número de días mayor a 0."); return; }
  try {
    await db.collection("presupuestosGenerados").doc(id).update({
      diasSeguimiento: n,
      proximoSeguimientoMillis: Date.now() + n * 86400000,
    });
    await loadAll();
  } catch (err) {
    alert("No se pudo reprogramar: " + err.message);
  }
}

async function deletePresupuestador(id) {
  if (!confirm("¿Borrar este presupuesto del historial?")) return;
  try {
    await db.collection("presupuestosGenerados").doc(id).delete();
    await loadAll();
  } catch (err) {
    alert("No se pudo borrar: " + err.message);
  }
}

function seguimientosPendientesCount(modulo) {
  const hoy = Date.now();
  const lista = presupuestosParaModulo(modulo);
  const porSeguimiento = lista.filter((p) => p.estado === "enviado" && p.proximoSeguimientoMillis && p.proximoSeguimientoMillis <= hoy);
  const porVencer = lista.filter((p) => p.estado === "enviado" && p.avisoVencimientoMillis && p.avisoVencimientoMillis <= hoy && (!p.proximoSeguimientoMillis || p.proximoSeguimientoMillis > hoy));
  return porSeguimiento.length + porVencer.length;
}

function renderSeguimientosAlert(modulo) {
  const elId = modulo === "contenido" ? "seguimientos-alert-contenido" : "seguimientos-alert-design";
  const el = document.getElementById(elId);
  if (!el) return;
  const hoy = Date.now();
  const lista = presupuestosParaModulo(modulo);
  const pendientes = lista.filter((p) => p.estado === "enviado" && p.proximoSeguimientoMillis && p.proximoSeguimientoMillis <= hoy);
  const porVencer = lista.filter((p) => p.estado === "enviado" && p.avisoVencimientoMillis && p.avisoVencimientoMillis <= hoy);
  if (pendientes.length === 0 && porVencer.length === 0) { el.innerHTML = ""; return; }
  const lineas = [];
  if (pendientes.length > 0) {
    lineas.push(`<div><strong>Seguimientos pendientes (${pendientes.length}):</strong> ${pendientes.map((p) => esc(p.clienteNombre)).join(", ")}.</div>`);
  }
  if (porVencer.length > 0) {
    lineas.push(`<div><strong>Presupuestos por vencer sin aprobar (${porVencer.length}):</strong> ${porVencer
      .map((p) => `${esc(p.clienteNombre)} (vence ${new Date(p.validoHastaMillis).toLocaleDateString("es-AR")})`)
      .join(", ")} — escríbales antes de que se venza la validez.</div>`);
  }
  el.innerHTML = `
    <div class="seguimiento-alert">
      ${lineas.join("")}
      <div class="muted" style="margin-top:4px;">Revíselos en la pestaña "Presupuestos".</div>
    </div>
  `;
}

// ------------------------------------------------------------
// Modal / export / utils
// ------------------------------------------------------------
function openModal(html) {
  document.getElementById("modal-root").innerHTML = `<div class="modal-backdrop" onclick="if(event.target===this) closeModal()"><div class="modal frame-ticks">${html}</div></div>`;
}
function openModalWide(html) {
  document.getElementById("modal-root").innerHTML = `<div class="modal-backdrop" onclick="if(event.target===this) closeModal()"><div class="modal wide frame-ticks">${html}</div></div>`;
}
function closeModal() { document.getElementById("modal-root").innerHTML = ""; }

function exportData() {
  const blob = new Blob([JSON.stringify(state, null, 2)], { type: "application/json" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "clientes-proyectos-" + new Date().toISOString().slice(0, 10) + ".json";
  a.click();
}

function esc(str) {
  if (!str) return "";
  return String(str).replace(/[&<>"']/g, (m) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[m]));
}
function escAttr(str) { return esc(str); }
function formatDate(d) {
  const date = new Date(d + "T00:00:00");
  return date.toLocaleDateString("es-AR", { day: "2-digit", month: "2-digit", year: "numeric" });
}
function formatMoney(n) {
  return "$" + Number(n).toLocaleString("es-AR");
}

document.addEventListener("DOMContentLoaded", init);
